<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ablage">
<meta name="theme-color" content="#08060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ablage</title>
<style>
:root{
  --bg:#08060c;--card:rgba(255,255,255,.06);--card-2:rgba(255,255,255,.12);--solid:#1b1521;
  --text:#f6f3f8;--muted:rgba(246,243,248,.56);--line:rgba(255,255,255,.09);
  --accent:#e6bfff;--grad:linear-gradient(135deg,#8b5cff 0%,#d9468f 100%);
  --danger:#ff6b81;--warn:#ffc069;--ok:#4be39b;--chip:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
html,body{margin:0;color:var(--text);overflow-x:hidden}
body{font:16px/1.4 "Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(70% 45% at 108% 6%,rgba(178,84,130,.55),transparent 70%),
  radial-gradient(60% 40% at -12% 34%,rgba(96,60,176,.38),transparent 70%),
  radial-gradient(80% 50% at 60% 112%,rgba(150,62,116,.38),transparent 70%),var(--bg)}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 12px;
  background:rgba(8,6,12,.55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.top h1{flex:1;margin:0;font-size:17px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-text{background:none;border:0;color:var(--text);font-size:16px;padding:8px 4px;min-width:84px;text-align:left;display:flex;align-items:center;gap:2px}
.btn-text.right{justify-content:flex-end;text-align:right}
.btn-text.strong{font-weight:600;color:var(--accent)}
.btn-text:disabled{opacity:.35}
.big-title{font-size:32px;font-weight:500;letter-spacing:-.5px;margin:4px 16px 12px}
.wrap{padding:0 16px 140px;max-width:720px;margin:0 auto}

/* Kopf der Startseite */
.hero{display:flex;align-items:center;gap:12px;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.avatar{width:50px;height:50px;border-radius:50%;background:#fff;color:#141018;display:grid;place-items:center;flex:none}
.greet .g1{font-size:16px;font-weight:500}
.greet .g2{font-size:14px;color:var(--muted)}
.hero .sp{flex:1}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  background:var(--card);border:1px solid var(--line);color:var(--text);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 2px #1a1220}

/* Übersicht */
.stat{position:relative;margin:22px 0 6px;min-height:150px;padding-right:140px}
.stat-l{font-size:18px;font-weight:500}
.stat-n{font-size:52px;font-weight:500;letter-spacing:-1.5px;line-height:1.05;margin:8px 0 10px}
.stat-n span{color:var(--muted);font-size:22px;letter-spacing:0;margin-left:4px}
.stat-s{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat-s svg{width:18px;height:18px}
.mini{position:absolute;right:-16px;top:-8px;width:146px;height:164px;border-radius:22px 0 0 22px;padding:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.03));border:1px solid var(--line);border-right:0;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:left;color:var(--text);display:flex;flex-direction:column;
  box-shadow:-12px 14px 40px rgba(0,0,0,.4)}
.mini .k{font-weight:700;letter-spacing:1.5px;font-size:13px;font-style:italic}
.mini .n{font-size:44px;font-weight:500;margin-top:auto;line-height:1}
.mini .s{font-size:12px;color:var(--muted);margin-top:6px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 6px}
.qa button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:0}
.qa .c{width:100%;max-width:86px;height:56px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.qa button.on{color:var(--text);font-weight:500}
.qa button.on .c{background:#fff;color:#141018;border-color:#fff}
.qa button:active .c{transform:scale(.95)}

.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:48px;color:var(--muted);margin-top:18px}
.search svg{width:19px;height:19px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;min-width:0}
.search input::placeholder{color:var(--muted)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:500;color:var(--text);margin:28px 2px 12px}
.link{background:none;border:0;color:var(--muted);font-size:14px;padding:0}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.folder{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;min-height:110px;display:flex;flex-direction:column;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.folder:active,.row:active{opacity:.6}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px}
.folder .name{font-weight:500;margin-top:auto;padding-top:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.folder .count{color:var(--muted);font-size:13px}

.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.rc{flex:1;min-width:0}
.rc .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:22px;line-height:1}
.thumb{width:44px;height:56px;border-radius:12px;object-fit:cover;object-position:top;background:rgba(255,255,255,.9);flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#d9468f}
.badge{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.late{background:rgba(255,107,129,.16);color:var(--danger)}
.badge.soon{background:rgba(255,192,105,.16);color:var(--warn)}
.badge.ok{background:rgba(75,227,155,.14);color:var(--ok)}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:44px;margin-bottom:8px}

/* Leiste unten */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px;align-items:center;
  padding:7px;border-radius:999px;background:rgba(22,16,28,.72);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:0 12px 40px rgba(0,0,0,.55)}
.nav button{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.07);color:var(--text);display:grid;place-items:center;position:relative}
.nav button.on{background:rgba(255,255,255,.2)}
.nav .scan{width:62px;height:62px;background:var(--grad);box-shadow:0 8px 26px rgba(201,70,160,.5)}
.nav .scan svg{width:26px;height:26px}
.nav button:active{transform:scale(.94)}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px;font-size:14px;color:var(--muted)}
.banner b{display:block;font-size:15px;font-weight:500;color:var(--text)}
.banner .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:0 2px}

/* Update-Karte */
.upd{margin-top:16px;padding:16px;border-radius:26px;background:linear-gradient(135deg,rgba(139,92,255,.3),rgba(217,70,143,.24));border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.upd .h{display:flex;gap:12px;align-items:center}
.upd .gi{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;color:#fff}
.upd b{display:block;font-weight:500;font-size:17px}
.upd small{color:var(--muted);font-size:14px}
.cta{display:flex;gap:10px;margin-top:14px}
.cta .go{flex:1;height:54px;border-radius:999px;border:0;background:#fff;color:#141018;font-size:17px;font-weight:500}
.cta .arrow{width:54px;height:54px;border-radius:50%;border:0;background:#fff;color:#141018;display:grid;place-items:center;flex:none}
.cta button:active{transform:scale(.97)}

/* Formular */
.fgroup{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:16px}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>span{width:96px;flex:none;color:var(--muted)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;padding:13px 0;text-align:right;-webkit-appearance:none;appearance:none}
.field input::placeholder,.field textarea::placeholder{color:rgba(246,243,248,.3)}
.field input[type=date]{min-height:24px}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.field.col>span{width:auto;font-size:13px}
.field textarea{text-align:left;resize:none;padding-top:6px}
.field select{direction:rtl}
.field select option{direction:ltr;color:#000}
.hint{color:var(--muted);font-size:13px;margin:8px 6px 0}

.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px}
.emojis button{aspect-ratio:1;border:0;border-radius:50%;background:var(--chip);font-size:21px}
.emojis button.on{outline:2px solid #fff}
.colors{display:flex;gap:10px;padding:14px 16px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:0}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);border-radius:999px;padding:15px;font-size:16px;font-weight:500;background:var(--card);color:var(--text)}
.btn.primary{background:#fff;color:#141018;border-color:#fff}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}
.btns{display:grid;gap:10px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}

/* Dokument */
.meta{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.meta .mrow{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.meta .mrow:last-child{border-bottom:0}
.meta .k{color:var(--muted)}
.meta .v{text-align:right;min-width:0;overflow-wrap:anywhere}
.note{white-space:pre-wrap;text-align:left!important}
.pages{display:grid;gap:14px;margin-top:18px}
.pagewrap{position:relative}
.page{width:100%;display:block;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pnum{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.pdel{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.pdel svg{width:18px;height:18px}
.toggle{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--accent)}

/* Scan-Sitzung */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.sitem{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px}
.sitem img{width:100%;aspect-ratio:3/4;object-fit:contain;background:rgba(255,255,255,.05);border-radius:12px;display:block}
.sitem .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:14px}
.sitem .ctl button{background:none;border:0;color:var(--text);padding:4px 6px}
.sitem .ctl button.del{color:var(--danger)}
.sitem .ctl svg{width:20px;height:20px}

/* Editor */
.editor{position:fixed;inset:0;z-index:50;background:#08060c;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.editor .top{position:static;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.ed-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.ed-box{position:relative;touch-action:none}
.ed-box canvas{display:block;width:100%;height:100%}
.ed-box svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.handle{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;touch-action:none}
.handle::after{content:"";position:absolute;inset:13px;border-radius:50%;background:rgba(217,70,143,.45);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.prev{max-width:calc(100% - 32px);max-height:calc(100% - 32px);background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ed-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px 16px}
.ed-bar button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;border-radius:999px;padding:10px 15px;font-size:15px;display:flex;align-items:center;gap:6px}
.ed-bar button svg{width:18px;height:18px}
.ed-bar button.on{background:#fff;color:#141018}
.ed-help{text-align:center;color:var(--muted);font-size:13px;padding:0 20px}
.loupe{position:fixed;z-index:60;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;display:none;background:#000}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,12,.6);font-size:15px;z-index:3}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#e08fd0;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sheet + Toast */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom));animation:fade .15s}
.sheet{background:var(--solid);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:8px}
.sheet-t{color:var(--muted);font-size:13px;text-align:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet button,.sheet-cancel{display:block;width:100%;border:0;background:none;padding:17px;font-size:17px;color:var(--text);border-bottom:1px solid var(--line)}
.sheet button:last-child{border-bottom:0}
.sheet button.danger{color:var(--danger)}
.sheet-cancel{background:#fff;color:#141018;border-radius:999px;font-weight:500;border:0}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(36,27,44,.95);border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="backupInput" accept=".zip,application/zip" hidden>
<script>
'use strict';
// Bei jeder neuen Version erhöhen – daran erkennt die App, dass es ein Update gibt.
const APP_VERSION = '2026.11.22-3';
/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function localISO(d = new Date()) { return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const safeName = s => (String(s || 'Dokument').replace(/[\\/:*?"<>|\n\r\t]/g, '-').trim() || 'Dokument').slice(0, 80);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

const ICON = {};
const svg = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
ICON.gear = svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>');
ICON.search = svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>');
ICON.camera = svg('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>');
ICON.plus = svg('<path d="M12 5v14M5 12h14"/>');
ICON.photo = svg('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>');
ICON.share = svg('<path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>');
ICON.trash = svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>');

/* ---------- Datenbank (IndexedDB, nur auf dem Gerät) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('ablage', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore('folders', {keyPath: 'id'});
    d.createObjectStore('docs', {keyPath: 'id'});
    d.createObjectStore('blobs', {keyPath: 'id'});
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
function tx(store, mode, fn) {
  return dbp.then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abgebrochen'));
  }));
}
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));

const S = {folders: [], docs: [], q: '', session: null, urls: []};
const DEFAULT_FOLDERS = [
  ['🧾', 'Rechnungen', '#0a66ff'], ['🏦', 'Bank & Finanzen', '#1f9d55'], ['🛡️', 'Versicherungen', '#7a5af8'],
  ['🏛️', 'Behörden & Steuern', '#c97a00'], ['🩺', 'Gesundheit', '#e0352b'], ['🏠', 'Wohnen & Verträge', '#0e9aa7'],
  ['💼', 'Arbeit', '#5b6b7f'], ['📦', 'Sonstiges', '#8e8e93']];
const EMOJIS = ['📁','🧾','🏦','🛡️','🏛️','🩺','🏠','💼','📦','🚗','📱','⚡','🎓','👶','🐾','✈️','🧑‍⚖️','💶','📈','🎁','🔧','🏋️','📚','❤️'];

async function loadAll() {
  S.folders = (await dbAll('folders')).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  S.docs = await dbAll('docs');
}
async function ensureDefaults() {
  if (S.folders.length || S.docs.length || lsGet('ablage.init', '') === '1') return;
  for (let i = 0; i < DEFAULT_FOLDERS.length; i++) {
    const [emoji, name, color] = DEFAULT_FOLDERS[i];
    await dbPut('folders', {id: uid(), name, emoji, color, order: i});
  }
  lsSet('ablage.init', '1');
  await loadAll();
}
const folderById = id => S.folders.find(f => f.id === id);
const docById = id => S.docs.find(d => d.id === id);
const isUnsorted = d => !d.folderId || !folderById(d.folderId);
// Unterordner: jeder Ordner kann eine parentId haben (leer = Hauptebene)
const parentOf = f => f && f.parentId && folderById(f.parentId) ? f.parentId : null;
const childFolders = pid => S.folders.filter(f => parentOf(f) === (pid || null));
function descendantIds(id) { const out = [id]; for (let i = 0; i < out.length; i++) childFolders(out[i]).forEach(c => out.push(c.id)); return out; }
function folderPath(f) { const p = []; let x = f, n = 0; while (x && n++ < 30) { p.unshift(x); x = folderById(parentOf(x)); } return p; }
const pathName = f => folderPath(f).map(x => x.name).join(' › ');
function folderTree(pid = null, depth = 0, out = [], skip = null) {
  childFolders(pid).forEach(f => { if (f.id === skip) return; out.push({f, depth}); folderTree(f.id, depth + 1, out, skip); });
  return out;
}
function folderDocCount(id) { const ids = new Set(descendantIds(id)); return S.docs.filter(d => ids.has(d.folderId)).length; }
function requestPersist() { try { navigator.storage?.persist?.(); } catch {} }

/* ---------- Navigation ---------- */
const app = $('#app');
const stack = [{view: 'home', params: {}}];
const views = {};
const cur = () => stack[stack.length - 1];
function go(view, params = {}) { cur().scroll = scrollY; stack.push({view, params}); render(); }
function back() { if (stack.length > 1) stack.pop(); render(true); }
function resetTo(...entries) { stack.length = 0; entries.forEach(e => stack.push(e)); render(); }
function render(restore) {
  S.urls.forEach(u => URL.revokeObjectURL(u)); S.urls = [];
  const c = cur();
  views[c.view](c.params || {});
  scrollTo(0, restore ? (c.scroll || 0) : 0);
}
function setView(html) { app.innerHTML = html; }

/* ---------- UI-Bausteine ---------- */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
// Optionen: {label, danger, run}. "run" läuft direkt im Tipp (wichtig für Kamera/Teilen auf iOS).
function sheet(title, options) {
  const m = document.createElement('div'); m.className = 'sheet-bg';
  m.innerHTML = `<div class="sheet">${title ? `<div class="sheet-t">${esc(title)}</div>` : ''}${options.map((o, i) =>
    `<button data-i="${i}" class="${o.danger ? 'danger' : ''}">${esc(o.label)}</button>`).join('')}</div>
    <button class="sheet-cancel" data-i="-1">Abbrechen</button>`;
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b && e.target !== m) return;
    m.remove();
    const i = b ? +b.dataset.i : -1;
    if (i >= 0) options[i].run();
  });
  document.body.appendChild(m);
}
const confirmSheet = (title, label, run) => sheet(title, [{label, danger: true, run}]);

function thumbHtml(d) {
  if (d.thumb) return `<img class="thumb" src="${d.thumb}" alt="">`;
  return `<div class="thumb">PDF</div>`;
}
function dueBadge(d) {
  if (!d.due) return '';
  if (d.done) return `<span class="badge ok">erledigt</span>`;
  const days = Math.round((new Date(d.due + 'T00:00') - new Date(localISO() + 'T00:00')) / 864e5);
  if (days < 0) return `<span class="badge late">überfällig</span>`;
  if (days === 0) return `<span class="badge late">heute</span>`;
  if (days <= 7) return `<span class="badge soon">in ${days} ${days === 1 ? 'Tag' : 'Tagen'}</span>`;
  return `<span class="badge">${fmtDate(d.due).slice(0, 6)}</span>`;
}
function docRow(d, showFolder = true) {
  const f = folderById(d.folderId);
  const sub = [d.sender, fmtDate(d.date)].filter(Boolean).join(' · ');
  return `<button class="row" data-doc="${d.id}">${thumbHtml(d)}<div class="rc">
    <div class="t">${esc(d.title || 'Ohne Titel')}</div>
    <div class="s">${esc(sub || '–')}</div>
    ${showFolder && f ? `<div class="s">${f.emoji} ${esc(pathName(f))}</div>` : ''}
  </div>${dueBadge(d)}<span class="chev">›</span></button>`;
}
function folderTile(f, n, subs = 0) {
  if (n === undefined) { n = folderDocCount(f.id); subs = childFolders(f.id).length; }
  return `<button class="folder" data-folder="${f.id}">
    <div class="ico" style="background:${f.color}22">${f.emoji}</div>
    <div class="name">${esc(f.name)}</div><div class="count">${n} ${n === 1 ? 'Dokument' : 'Dokumente'}${subs ? ` · ${subs} ${subs === 1 ? 'Unterordner' : 'Unterordner'}` : ''}</div></button>`;
}
const hasLateDue = () => S.docs.some(d => d.due && !d.done && d.due <= localISO());
function bottomNav(active, ctx = '') {

    <button data-act="navHome" class="${active === 'home' ? 'on' : ''}" aria-label="Start">${ICON.home}</button>
    <button data-act="navDeadlines" class="${active === 'deadlines' ? 'on' : ''}" aria-label="Fristen">${ICON.bell}${hasLateDue() ? '<span class="dot"></span>' : ''}</button>
    <button class="scan" data-act="scan" data-ctx="${ctx}" aria-label="Scannen">${ICON.camera}</button>

    <button data-act="newFolder" data-parent="${ctx}" aria-label="${ctx ? 'Neuer Unterordner' : 'Neuer Ordner'}">${ICON.folderPlus}</button>
  </nav>`;
}
function greeting() { const h = new Date().getHours(); return h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend'; }
function updateCard() {
  if (!updateReady) return '';
  return `<div class="upd"><div class="h"><div class="gi">${ICON.spark}</div>
    <div><b>Neue Version verfügbar</b><small>Deine Briefe bleiben dabei erhalten.</small></div></div>
    <div class="cta"><button class="go" data-act="applyUpdate">Jetzt aktualisieren</button>
    <button class="arrow" data-act="applyUpdate" aria-label="Jetzt aktualisieren">${ICON.arrow}</button></div></div>`;
}
const byDate = (a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created;

function searchDocs(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return S.docs.filter(d => {
    const f = folderById(d.folderId);
    const hay = [d.title, d.sender, d.note, f ? pathName(f) : '', fmtDate(d.date)].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).sort(byDate);
}

    }
    function filterUI() {
      const modes = [['color', 'Farbe'], ['gray', 'Graustufen'], ['bw', 'Schwarz-Weiß'], ['original', 'Original']];
      m.innerHTML = `<header class="top"><button class="btn-text" data-a="back">${ICON.back}Ecken</button><h1>Darstellung</h1><button class="btn-text right strong" data-a="done">Übernehmen</button></header>
        <div class="ed-stage"><canvas class="prev"></canvas></div>
        <div class="ed-bar">${modes.map(([k, l]) => `<button data-mode="${k}" class="${k === mode ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      renderPrev();
    }
    function renderPrev() {

    }
    m.addEventListener('click', async e => {
      const b = e.target.closest('[data-a],[data-mode]'); if (!b) return;
      const a = b.dataset.a;

      if (a === 'cancel') close(null);

      else if (a === 'auto') { const q = detectQuad(c); if (q) { quad = q; drawQuad(); } else toast('Keine Kanten gefunden – bitte von Hand anpassen'); }

        catch (err) { busy(false); toast('Fehler: ' + err.message); }

}

/* ---------- PDF erzeugen (ohne Fremdbibliothek) ---------- */
function buildPdf(pages) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.byteLength; };
  const n = pages.length, total = 2 + n * 3;
  add('%PDF-1.4\n%âãÏÓ\n');
  offs[1] = len; add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = len; add(`2 0 obj\n<< /Type /Pages /Kids [${pages.map((_, k) => `${3 + k * 3} 0 R`).join(' ')}] /Count ${n} >>\nendobj\n`);
  pages.forEach((p, k) => {
    const pid = 3 + k * 3, cid = pid + 1, iid = pid + 2;
    let W, H; if (p.w > p.h) { H = 595.28; W = H * p.w / p.h; } else { W = 595.28; H = W * p.h / p.w; }
    const cs = `q ${W.toFixed(2)} 0 0 ${H.toFixed(2)} 0 0 cm /Im0 Do Q`;
    offs[pid] = len; add(`${pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
    offs[cid] = len; add(`${cid} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    const img = new Uint8Array(p.data);
    offs[iid] = len; add(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.byteLength} >>\nstream\n`);
    add(img); add('\nendstream\nendobj\n');
  });
  const xref = len; let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x + `trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type: 'application/pdf'});
}
async function docPdf(d) {
  if (d.kind === 'pdf') { const b = await dbGet('blobs', d.blobId); return new Blob([b.data], {type: 'application/pdf'}); }
  const pages = (await Promise.all((d.pageIds || []).map(id => dbGet('blobs', id)))).filter(Boolean);
  return buildPdf(pages);
}
const pdfName = d => safeName((d.date ? d.date + ' ' : '') + (d.title || 'Dokument')) + '.pdf';

/* ---------- Teilen / Speichern ---------- */
function downloadFile(file) {
  const u = URL.createObjectURL(file), a = document.createElement('a');
  a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
function shareNow(file) {
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    return navigator.share({files: [file]}).then(() => true, e => { if (e.name === 'AbortError') return true; throw e; });
  }
  downloadFile(file); return Promise.resolve(true);
}
// iOS erlaubt "Teilen" nur direkt nach einem Tipp. Klappt es nicht, fragen wir noch einmal nach.
async function offerFile(file, label) {
  try { await shareNow(file); }
  catch (e) {
    sheet(`${label} ist fertig (${fmtSize(file.size)})`, [{label: 'Teilen / In „Dateien“ sichern', run: () => shareNow(file).catch(() => downloadFile(file))}]);
  }
}

/* ---------- ZIP (Backup) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(lh, nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(ch, nm);
    off += 30 + nm.length + sz;
  }
  const cs = central.reduce((a, p) => a + p.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);

}
async function readZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer), dec = new TextDecoder(), out = {}; let p = 0;
  while (p + 30 <= buf.length && dv.getUint32(p, true) === 0x04034b50) {
    const method = dv.getUint16(p + 8, true), size = dv.getUint32(p + 18, true), nl = dv.getUint16(p + 26, true), xl = dv.getUint16(p + 28, true);
    const name = dec.decode(buf.subarray(p + 30, p + 30 + nl)), start = p + 30 + nl + xl;

  let p = path, i = 2; while (used.has(p)) p = path.replace(/\.pdf$/, ` (${i++}).pdf`); used.add(p); return p;

};
async function storePages(pages) {
  const ids = [];
  for (const p of pages) { const id = uid(); await dbPut('blobs', {id, data: await p.blob.arrayBuffer(), type: 'image/jpeg', w: p.w, h: p.h}); ids.push(id); }
  return ids;
}

document.addEventListener('click', e => {
  if (e.target.closest('.editor,.sheet-bg')) return;
  const t = e.target.closest('[data-act],[data-go],[data-doc],[data-folder]'); if (!t) return;
  if (t.dataset.act) { e.preventDefault(); actions[t.dataset.act]?.(t); }
  else if (t.dataset.go) go(t.dataset.go, {id: t.dataset.id, mode: t.dataset.mode});
  else if (t.dataset.doc) go('doc', {id: t.dataset.doc});
  else if (t.dataset.folder) go('folder', {id: t.dataset.folder});
});

/* ---------- Updates ---------- */
// Holt die aktuelle index.html direkt vom Server (an der Zwischenspeicherung vorbei) und vergleicht die Version.
let updateReady = false, lastCheck = 0;
const VERSION_RE = new RegExp("APP_" + "VERSION = '([0-9.\\-]+)'");
const freshIndex = () => fetch('./index.html?fresh=' + Date.now(), {cache: 'no-store'});
async function checkUpdate(manual) {
  if (!manual && Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const r = await freshIndex(); if (!r.ok) throw new Error(r.status);
    const m = (await r.text()).match(VERSION_RE);
    const found = !!(m && m[1] !== APP_VERSION);
    if (found && !updateReady) { updateReady = m[1]; if (['home', 'settings'].includes(cur().view)) render(true); }
    if (manual) toast(found ? 'Neue Version gefunden' : 'Du hast die neueste Version ✓');
  } catch { if (manual) toast('Keine Verbindung – bitte später erneut versuchen'); }
}
async function applyUpdate() {
  toast('Wird aktualisiert…');
  try {
    const html = await (await freshIndex()).text();
    if ('caches' in window) {
      for (const k of await caches.keys()) {
        if (!k.startsWith('ablage-') || k.includes('fonts')) continue;
        const c = await caches.open(k);
        for (const p of ['./', './index.html'])
          await c.put(new Request(new URL(p, location.href)), new Response(html, {headers: {'Content-Type': 'text/html; charset=utf-8'}}));
      }
    }
    const reg = await navigator.serviceWorker?.getRegistration?.();
    if (reg) await reg.update().catch(() => {});
  } catch {}
  location.reload();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

/* ---------- Start ---------- */
(async () => {
  try { await loadAll(); await ensureDefaults(); }
  catch (e) { app.innerHTML = `<div class="empty"><div class="big">⚠️</div>Speicher nicht verfügbar.<br>${esc(e.message)}</div>`; return; }
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  setTimeout(() => checkUpdate(), 1500);
})();
</script>
