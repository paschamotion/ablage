<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ablage">
<meta name="theme-color" content="#08060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<title>Ablage</title>
<style>
:root{
  --bg:#08060c;--card:rgba(255,255,255,.06);--card-2:rgba(255,255,255,.12);--solid:#1b1521;
  --text:#f6f3f8;--muted:rgba(246,243,248,.56);--line:rgba(255,255,255,.09);
  --accent:#e6bfff;--grad:linear-gradient(135deg,#8b5cff 0%,#d9468f 100%);
  --danger:#ff6b81;--warn:#ffc069;--ok:#4be39b;--chip:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
html,body{margin:0;color:var(--text);overflow-x:hidden}
body{font:16px/1.4 "Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(70% 45% at 108% 6%,rgba(178,84,130,.55),transparent 70%),
  radial-gradient(60% 40% at -12% 34%,rgba(96,60,176,.38),transparent 70%),
  radial-gradient(80% 50% at 60% 112%,rgba(150,62,116,.38),transparent 70%),var(--bg)}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px;vertical-align:-2px}
svg.i.chev{width:18px;height:18px;color:var(--muted)}
svg.i.logo{width:24px;height:24px;stroke-width:2}
svg.i.empty-i{width:46px;height:46px;stroke-width:1.4;color:var(--muted)}
.link{display:inline-flex;align-items:center;gap:2px}
.title-ico{display:flex;align-items:center;gap:12px}
.title-ico span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 12px;
  background:rgba(8,6,12,.55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.top h1{flex:1;margin:0;font-size:17px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-text{background:none;border:0;color:var(--text);font-size:16px;padding:8px 4px;min-width:84px;text-align:left;display:flex;align-items:center;gap:2px}
.btn-text.right{justify-content:flex-end;text-align:right}
.btn-text.strong{font-weight:600;color:var(--accent)}
.btn-text:disabled{opacity:.35}
.big-title{font-size:32px;font-weight:500;letter-spacing:-.5px;margin:4px 16px 12px}
.wrap{padding:0 16px 140px;max-width:720px;margin:0 auto}

/* Kopf der Startseite */
.hero{display:flex;align-items:center;gap:12px;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.avatar{width:50px;height:50px;border-radius:50%;background:#fff;color:#141018;display:grid;place-items:center;flex:none}
.greet .g1{font-size:16px;font-weight:500}
.greet .g2{font-size:14px;color:var(--muted)}
.hero .sp{flex:1}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  background:var(--card);border:1px solid var(--line);color:var(--text);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 2px #1a1220}

.avatar{border:0;padding:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.greet{min-width:0}
.greet .g1,.greet .g2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Willkommen + Profil */
.onb{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:28px 24px calc(28px + env(safe-area-inset-bottom));position:relative;overflow:hidden;max-width:560px;margin:0 auto}
.onb.onb-edit{min-height:0;padding-top:12px}
.orb{position:absolute;z-index:-1;pointer-events:none;width:150%;aspect-ratio:1;right:-88%;top:9%;border-radius:50%;
  background:radial-gradient(circle at 62% 46%,#08060c 56%,rgba(236,150,196,.85) 63.5%,rgba(160,70,120,.35) 68%,transparent 74%);filter:blur(1.5px)}
.orb::after{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle at 70% 50%,rgba(190,90,140,.35),transparent 62%);z-index:-1}
.onb-logo{display:flex;align-items:center;gap:8px;font-size:23px;font-weight:500;margin-top:36px}
.onb-logo svg{width:28px;height:28px;stroke-width:2.2}
.onb-h{font-size:54px;line-height:1.06;font-weight:500;letter-spacing:-1.2px;margin:auto 0 18px}
.onb-h .dim{color:rgba(246,243,248,.42)}
.onb-p{color:var(--muted);font-size:16px;line-height:1.45;max-width:290px;margin:0 0 22px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.dots b{width:28px;height:3px;border-radius:2px;background:#fff}
.onb .cta{margin-top:48px}
.onb-step{color:var(--muted);font-size:14px;margin-top:8px}
.onb-h2{font-size:40px;font-weight:500;letter-spacing:-.8px;margin:10px 0 10px;line-height:1.1}
.pf-av{width:136px;height:136px;border-radius:50%;margin:26px auto 6px;position:relative;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.pf-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pf-av .pf-user{width:58px;height:58px;stroke-width:1.4}
.pf-badge{position:absolute;right:2px;bottom:2px;width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;border:3px solid var(--bg)}
.pf-badge svg{width:19px;height:19px}
.pf-input{width:100%;height:58px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:18px;padding:0 22px;outline:none;text-align:center;margin-top:18px}
.pf-input::placeholder{color:rgba(246,243,248,.35)}
.pf-input:focus{border-color:rgba(255,255,255,.3)}
.skip{background:none;border:0;color:var(--muted);margin-top:12px;font-size:15px;align-self:center;padding:6px 10px}

/* Übersicht */
.stat{position:relative;margin:22px 0 6px;min-height:150px;padding-right:140px}
.stat-l{font-size:18px;font-weight:500}
.stat-n{font-size:52px;font-weight:500;letter-spacing:-1.5px;line-height:1.05;margin:8px 0 10px}
.stat-n span{color:var(--muted);font-size:22px;letter-spacing:0;margin-left:4px}
.stat-s{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat-s svg{width:18px;height:18px}
.mini{position:absolute;right:-16px;top:-8px;width:146px;height:164px;border-radius:22px 0 0 22px;padding:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.03));border:1px solid var(--line);border-right:0;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:left;color:var(--text);display:flex;flex-direction:column;
  box-shadow:-12px 14px 40px rgba(0,0,0,.4)}
.mini .k{font-weight:700;letter-spacing:1.5px;font-size:13px;font-style:italic}
.mini .n{font-size:44px;font-weight:500;margin-top:auto;line-height:1}
.mini .s{font-size:12px;color:var(--muted);margin-top:6px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 6px}
.qa button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:0}
.qa .c{width:100%;max-width:86px;height:56px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.qa button.on{color:var(--text);font-weight:500}
.qa button.on .c{background:#fff;color:#141018;border-color:#fff}
.qa button:active .c{transform:scale(.95)}

/* Backup-Seite */
.bk-hero{display:flex;gap:14px;align-items:center;padding:18px;border-radius:24px;border:1px solid var(--line);background:var(--card)}
.bk-hero b{display:block;font-size:18px;font-weight:500}
.bk-hero small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.bk-big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(75,227,155,.15);color:var(--ok)}
.bk-big svg{width:27px;height:27px}
.bk-hero.bk-pending .bk-big{background:rgba(139,92,255,.22);color:#c9b3ff}
.bk-hero.bk-never{border-color:rgba(255,192,105,.4);background:linear-gradient(135deg,rgba(255,192,105,.12),rgba(255,255,255,.04))}
.bk-hero.bk-never .bk-big{background:rgba(255,192,105,.18);color:#ffc069;animation:bkShimmer 2.2s ease-in-out infinite}
.bk-hero.bk-old{border-color:rgba(255,107,129,.45);background:linear-gradient(135deg,rgba(255,107,129,.14),rgba(255,255,255,.04))}
.bk-hero.bk-old .bk-big{background:rgba(255,107,129,.18);color:#ff6b81}
.bk-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.bk-stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center}
.bk-stat .n{display:block;font-size:30px;font-weight:500;line-height:1.1}
.bk-stat .l{color:var(--muted);font-size:13px}
.bk-stat.warn .n{color:var(--warn)}
.bk-bar{height:8px;border-radius:99px;background:var(--chip);margin-top:16px;overflow:hidden}
.bk-bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.meta .mrow .v b{font-weight:500;color:var(--text)}
/* Backup-Knopf in der Leiste: gelb schimmernd = noch nie gesichert, rot = älter als 1 Monat */
.nav button.bk-never{color:#ffc069;border-color:rgba(255,192,105,.55);background:rgba(48,36,14,.82);animation:bkShimmer 2.2s ease-in-out infinite}
.nav button.bk-old{color:#ff6b81;border-color:rgba(255,107,129,.6);background:rgba(58,16,26,.85);box-shadow:0 0 14px rgba(255,77,109,.45),0 4px 14px rgba(0,0,0,.35)}
@keyframes bkShimmer{0%,100%{box-shadow:0 0 0 0 rgba(255,192,105,0),0 4px 14px rgba(0,0,0,.35)}50%{box-shadow:0 0 18px 4px rgba(255,192,105,.55),0 4px 14px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.nav button.bk-never{animation:none;box-shadow:0 0 14px rgba(255,192,105,.5)}}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:48px;color:var(--muted);margin-top:18px}
.search svg{width:19px;height:19px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;min-width:0}
.search input::placeholder{color:var(--muted)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:500;color:var(--text);margin:28px 2px 12px}
.link{background:none;border:0;color:var(--muted);font-size:14px;padding:0}

.sh-r{display:flex;align-items:center;gap:10px}
.add-btn{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 13px 0 9px;border-radius:999px;border:1px solid rgba(230,191,255,.35);
  background:linear-gradient(135deg,rgba(139,92,255,.32),rgba(217,70,143,.28));color:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.add-btn svg{width:17px;height:17px;stroke-width:2.2}
.add-btn:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
.chips button svg{width:16px;height:16px}
.chips button.on{background:#fff;color:#141018;border-color:#fff}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{width:34px;height:28px;border:0;border-radius:999px;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.seg button svg{width:16px;height:16px}
.seg button.on{background:#fff;color:#141018}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.folder{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;min-height:110px;display:flex;flex-direction:column;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.folder:active,.row:active{opacity:.6}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px}
.folder .name{font-weight:500;margin-top:auto;padding-top:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.folder .count{color:var(--muted);font-size:13px}

.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.rc{flex:1;min-width:0}
.rc .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:22px;line-height:1}
.thumb{width:44px;height:56px;border-radius:12px;object-fit:cover;object-position:top;background:rgba(255,255,255,.9);flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#d9468f}
.badge{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.late{background:rgba(255,107,129,.16);color:var(--danger)}
.badge.soon{background:rgba(255,192,105,.16);color:var(--warn)}
.badge.ok{background:rgba(75,227,155,.14);color:var(--ok)}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:44px;margin-bottom:8px}

/* Leiste unten */
.nav-fade{position:fixed;left:0;right:0;bottom:0;height:calc(150px + env(safe-area-inset-bottom));z-index:5;pointer-events:none;
  background:linear-gradient(to top,rgba(8,6,12,.92) 0%,rgba(8,6,12,.6) 45%,rgba(8,6,12,0) 100%);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 40%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 40%,transparent 100%)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:14px;align-items:center}
.nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(26,19,32,.78);color:rgba(246,243,248,.75);display:grid;place-items:center;position:relative;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.nav button svg{width:19px;height:19px}
.nav button.on{background:rgba(255,255,255,.9);color:#141018;border-color:transparent}
.nav button .dot{top:8px;right:9px}
.nav .scan{width:64px;height:64px;border:0;color:#fff;background:var(--grad);box-shadow:0 10px 28px rgba(201,70,160,.5);margin:0 4px}
.nav .scan svg{width:27px;height:27px}
.nav button:active{transform:scale(.94)}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px;font-size:14px;color:var(--muted)}
.banner b{display:block;font-size:15px;font-weight:500;color:var(--text)}
.banner .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:0 2px}

/* Update-Karte */
.upd{margin-top:16px;padding:16px;border-radius:26px;background:linear-gradient(135deg,rgba(139,92,255,.3),rgba(217,70,143,.24));border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.upd .h{display:flex;gap:12px;align-items:center}
.upd .gi{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;color:#fff}
.upd b{display:block;font-weight:500;font-size:17px}
.upd small{color:var(--muted);font-size:14px}
.cta{display:flex;gap:10px;margin-top:14px}
.cta .go{flex:1;height:54px;border-radius:999px;border:0;background:#fff;color:#141018;font-size:17px;font-weight:500}
.cta .arrow{width:54px;height:54px;border-radius:50%;border:0;background:#fff;color:#141018;display:grid;place-items:center;flex:none}
.cta button:active{transform:scale(.97)}

/* Formular */
.fgroup{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:16px}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>span{width:96px;flex:none;color:var(--muted)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;padding:13px 0;text-align:right;-webkit-appearance:none;appearance:none}
.field input::placeholder,.field textarea::placeholder{color:rgba(246,243,248,.3)}
.field input[type=date]{min-height:24px}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.field.col>span{width:auto;font-size:13px}
.field textarea{text-align:left;resize:none;padding-top:6px}
.field select{direction:rtl}
.field select option{direction:ltr;color:#000}
.hint{color:var(--muted);font-size:13px;margin:8px 6px 0}

.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px}
.emojis button{aspect-ratio:1;border:0;border-radius:50%;background:var(--chip);color:var(--text);display:grid;place-items:center;padding:0}
.emojis button svg{width:20px;height:20px}
.emojis button.on{outline:2px solid #fff}
.colors{display:flex;gap:10px;padding:14px 16px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:0}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);border-radius:999px;padding:15px;font-size:16px;font-weight:500;background:var(--card);color:var(--text)}
.btn.primary{background:#fff;color:#141018;border-color:#fff}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}
.btns{display:grid;gap:10px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}

/* Dokument */
.meta{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.meta .mrow{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.meta .mrow:last-child{border-bottom:0}
.meta .k{color:var(--muted)}
.meta .v{text-align:right;min-width:0;overflow-wrap:anywhere}
.note{white-space:pre-wrap;text-align:left!important}
.pages{display:grid;gap:14px;margin-top:18px}
.pagewrap{position:relative}
.page{width:100%;display:block;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pnum{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.pdel{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.pdel svg{width:18px;height:18px}
.toggle{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--accent)}

/* Scan-Sitzung */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.sitem{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px}
.sitem img{width:100%;aspect-ratio:3/4;object-fit:contain;background:rgba(255,255,255,.05);border-radius:12px;display:block}
.sitem .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:14px}
.sitem .ctl button{background:none;border:0;color:var(--text);padding:4px 6px}
.sitem .ctl button.del{color:var(--danger)}
.sitem .ctl svg{width:20px;height:20px}

/* Editor */
.editor{position:fixed;inset:0;z-index:50;background:#08060c;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.editor .top{position:static;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.ed-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.ed-box{position:relative;touch-action:none}
.ed-box canvas{display:block;width:100%;height:100%}
.ed-box svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.handle{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;touch-action:none}
.handle::after{content:"";position:absolute;inset:13px;border-radius:50%;background:rgba(217,70,143,.45);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.prev{max-width:calc(100% - 32px);max-height:calc(100% - 32px);background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ed-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px 16px}
.ed-bar button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;border-radius:999px;padding:10px 15px;font-size:15px;display:flex;align-items:center;gap:6px}
.ed-bar button svg{width:18px;height:18px}
.ed-bar button.on{background:#fff;color:#141018}
.ed-help{text-align:center;color:var(--muted);font-size:13px;padding:0 20px}
.loupe{position:fixed;z-index:60;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;display:none;background:#000}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,12,.6);font-size:15px;z-index:3}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#e08fd0;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sheet + Toast */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom));animation:fade .15s}
.sheet{background:var(--solid);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:8px}
.sheet-t{color:var(--muted);font-size:13px;text-align:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet button,.sheet-cancel{display:block;width:100%;border:0;background:none;padding:17px;font-size:17px;color:var(--text);border-bottom:1px solid var(--line)}
.sheet button:last-child{border-bottom:0}
.sheet button.danger{color:var(--danger)}
.sheet-cancel{background:#fff;color:#141018;border-radius:999px;font-weight:500;border:0}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(36,27,44,.95);border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
</style>
</head>

/* ---------- Datenbank (IndexedDB, nur auf dem Gerät) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('ablage', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore('folders', {keyPath: 'id'});
    d.createObjectStore('docs', {keyPath: 'id'});
    d.createObjectStore('blobs', {keyPath: 'id'});
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
function tx(store, mode, fn) {
  return dbp.then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abgebrochen'));
  }));
}
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));

const S = {folders: [], docs: [], q: '', session: null, urls: [], profile: null};
const DEFAULT_FOLDERS = [
  ['receipt', 'Rechnungen', '#6ea8ff'], ['wallet', 'Bank & Finanzen', '#4be39b'], ['shield-check', 'Versicherungen', '#a98bff'],
  ['landmark', 'Behörden & Steuern', '#ffc069'], ['heart-pulse', 'Gesundheit', '#ff7a8a'], ['house', 'Wohnen & Verträge', '#5fd4e0'],
  ['briefcase', 'Arbeit', '#a3b1c6'], ['package', 'Sonstiges', '#b9b3c4']];
const COLORS = ['#6ea8ff','#4be39b','#a98bff','#ffc069','#ff7a8a','#5fd4e0','#f08bd0','#a3b1c6','#b9b3c4'];
// alte (helle) Farben auf die neuen, für dunklen Hintergrund passenden umstellen
const OLD_COLORS = {'#0a66ff':'#6ea8ff','#1f9d55':'#4be39b','#7a5af8':'#a98bff','#c97a00':'#ffc069','#e0352b':'#ff7a8a','#0e9aa7':'#5fd4e0','#d6409f':'#f08bd0','#5b6b7f':'#a3b1c6','#8e8e93':'#b9b3c4'};

async function loadAll() {
  S.folders = (await dbAll('folders')).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  S.docs = await dbAll('docs');
  S.profile = (await dbGet('blobs', '__profile')) || null;
  // Umstellung von Emoji-Ordnern auf Lucide-Icons (einmalig)
  for (const f of S.folders) {
    if (f.icon && !f.emoji) continue;
    f.icon = f.icon || EMOJI_TO_ICON[f.emoji] || 'folder';
    if (OLD_COLORS[f.color]) f.color = OLD_COLORS[f.color];
    delete f.emoji;
    await dbPut('folders', f);
  }
  // Umstellung auf Bereiche (einmalig): alle bisherigen Hauptordner wandern in den Bereich „Briefe“
  const meta = (await dbGet('blobs', '__meta')) || {id: '__meta'};
  if (!meta.areas) {
    const tops = S.folders.filter(f => !f.parentId || !S.folders.some(x => x.id === f.parentId));
    if (tops.length) {
      const area = {id: uid(), name: 'Briefe', icon: 'mail', color: '#f08bd0', order: -1};
      await dbPut('folders', area);
      for (const f of tops) { f.parentId = area.id; await dbPut('folders', f); }
      S.folders.unshift(area);
    }
    meta.areas = true; await dbPut('blobs', meta);
  }
  S.meta = meta;
}
async function ensureDefaults() {
  if (S.folders.length || S.docs.length || lsGet('ablage.init', '') === '1') return;
  const area = {id: uid(), name: 'Briefe', icon: 'mail', color: '#f08bd0', order: 0};
  await dbPut('folders', area);
  for (let i = 0; i < DEFAULT_FOLDERS.length; i++) {
    const [icon, name, color] = DEFAULT_FOLDERS[i];
    await dbPut('folders', {id: uid(), name, icon, color, order: i + 1, parentId: area.id});
  }
  lsSet('ablage.init', '1');
  await loadAll();
}
const folderById = id => S.folders.find(f => f.id === id);
const docById = id => S.docs.find(d => d.id === id);
const isUnsorted = d => !d.folderId || !folderById(d.folderId);
// Unterordner: jeder Ordner kann eine parentId haben (leer = Hauptebene)
const parentOf = f => f && f.parentId && folderById(f.parentId) ? f.parentId : null;
const childFolders = pid => S.folders.filter(f => parentOf(f) === (pid || null));
function descendantIds(id) { const out = [id]; for (let i = 0; i < out.length; i++) childFolders(out[i]).forEach(c => out.push(c.id)); return out; }
function folderPath(f) { const p = []; let x = f, n = 0; while (x && n++ < 30) { p.unshift(x); x = folderById(parentOf(x)); } return p; }
const pathName = f => folderPath(f).map(x => x.name).join(' / ');
function folderTree(pid = null, depth = 0, out = [], skip = null) {
  childFolders(pid).forEach(f => { if (f.id === skip) return; out.push({f, depth}); folderTree(f.id, depth + 1, out, skip); });
  return out;
}
function folderDocCount(id) { const ids = new Set(descendantIds(id)); return S.docs.filter(d => ids.has(d.folderId)).length; }
function requestPersist() { try { navigator.storage?.persist?.(); } catch {} }

// Optionen: {label, danger, run}. "run" läuft direkt im Tipp (wichtig für Kamera/Teilen auf iOS).
function sheet(title, options) {
  const m = document.createElement('div'); m.className = 'sheet-bg';
  m.innerHTML = `<div class="sheet">${title ? `<div class="sheet-t">${esc(title)}</div>` : ''}${options.map((o, i) =>
    `<button data-i="${i}" class="${o.danger ? 'danger' : ''}">${esc(o.label)}</button>`).join('')}</div>
    <button class="sheet-cancel" data-i="-1">Abbrechen</button>`;
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b && e.target !== m) return;
    m.remove();
    const i = b ? +b.dataset.i : -1;
    if (i >= 0) options[i].run();
  });
  document.body.appendChild(m);
}

function searchDocs(q) {

    return words.every(w => hay.includes(w));
  }).sort(byDate);
}

async function avatarFromFile(file) {
  const img = await loadImage(file), s = Math.min(img.naturalWidth, img.naturalHeight), out = 320;
  const c = newCanvas(out, out);
  ctx2d(c).drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, out, out);
  return c.toDataURL('image/jpeg', .85);
}

function downloadFile(file) {
  const u = URL.createObjectURL(file), a = document.createElement('a');
  a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
function shareNow(file) {
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    return navigator.share({files: [file]}).then(() => true, e => { if (e.name === 'AbortError') return true; throw e; });
  }
  downloadFile(file); return Promise.resolve(true);
}
// iOS erlaubt "Teilen" nur direkt nach einem Tipp. Klappt es nicht, fragen wir noch einmal nach.
async function offerFile(file, label) {
  try { await shareNow(file); }
  catch (e) {
    sheet(`${label} ist fertig (${fmtSize(file.size)})`, [{label: 'Teilen / In „Dateien“ sichern', run: () => shareNow(file).catch(() => downloadFile(file))}]);
  }
}

/* ---------- ZIP (Backup) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(lh, nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(ch, nm);
    off += 30 + nm.length + sz;
  }
  const cs = central.reduce((a, p) => a + p.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cs, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], {type: 'application/zip'});
}
async function readZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer), dec = new TextDecoder(), out = {}; let p = 0;
  while (p + 30 <= buf.length && dv.getUint32(p, true) === 0x04034b50) {
    const method = dv.getUint16(p + 8, true), size = dv.getUint32(p + 18, true), nl = dv.getUint16(p + 26, true), xl = dv.getUint16(p + 28, true);
    const name = dec.decode(buf.subarray(p + 30, p + 30 + nl)), start = p + 30 + nl + xl;
    if (method !== 0) throw new Error('Diese ZIP-Datei stammt nicht aus der Ablage.');
    out[name] = buf.subarray(start, start + size); p = start + size;
  }
  return out;
}
function uniquePath(used, path) {
  let p = path, i = 2; while (used.has(p)) p = path.replace(/\.pdf$/, ` (${i++}).pdf`); used.add(p); return p;
}

/* ---------- Aktionen ---------- */
const cam = $('#camInput'), photos = $('#photoInput'), pdfIn = $('#pdfInput'), backupIn = $('#backupInput'), avatarIn = $('#avatarInput');
avatarIn.addEventListener('change', async () => {
  const f = avatarIn.files[0]; avatarIn.value = ''; if (!f || !pfDraft) return;
  try { pfDraft.photo = await avatarFromFile(f); render(true); } catch (e) { toast(e.message); }
});
function startSession(opts) { S.session = {pages: [], folderId: '', docId: null, ...opts}; }
function cleanupSession() { S.session?.pages?.forEach(p => URL.revokeObjectURL(p.url)); S.session = null; }

async function handleImages(files) {
  if (!S.session) startSession({});
  for (const file of files) {
    let c;
    try { c = toCanvas(await loadImage(file)); } catch (e) { toast(e.message); continue; }
    const r = await cropFlow(c);
    if (r) S.session.pages.push({...r, url: URL.createObjectURL(r.blob)});
  }
  if (cur().view === 'session') render();
  else if (S.session.pages.length) go('session');
  else cleanupSession();
}
cam.addEventListener('change', () => { const f = [...cam.files]; cam.value = ''; if (f.length) handleImages(f); });
photos.addEventListener('change', () => { const f = [...photos.files]; photos.value = ''; if (f.length) handleImages(f); });
pdfIn.addEventListener('change', () => {
  const f = pdfIn.files[0]; pdfIn.value = ''; if (!f) return;
  S.session.pdf = f; go('docForm', {mode: 'new'});
});
backupIn.addEventListener('change', async () => {
  const f = backupIn.files[0]; backupIn.value = ''; if (!f) return;
  try {
    toast('Backup wird gelesen…');
    const z = await readZip(f); const meta = z['ablage.json'];
    if (!meta) throw new Error('In dieser ZIP ist kein Ablage-Backup.');
    const data = JSON.parse(new TextDecoder().decode(meta));
    for (const fo of data.folders || []) await dbPut('folders', fo);
    if (data.profile && !S.profile?.name) await dbPut('blobs', data.profile);
    let n = 0;
    for (const d of data.docs || []) {
      const ids = d.kind === 'pdf' ? [d.blobId] : (d.pageIds || []);
      for (const id of ids) { const raw = z['daten/' + id], info = (data.blobs || {})[id] || {};
        if (raw) await dbPut('blobs', {id, data: raw.slice().buffer, type: info.type || 'image/jpeg', w: info.w, h: info.h}); }
      await dbPut('docs', d); n++;
    }
    await loadAll(); requestPersist(); render(); toast(`${n} Dokumente wiederhergestellt`);
  } catch (e) { toast(e.message || 'Backup konnte nicht gelesen werden'); }
});

const actions = {
  back,
  hideBanner() { lsSet('ablage.banner', 'off'); render(); },
  newFolder(t) { go('folderEdit', {parent: t.dataset.parent || ''}); },
  scan(t) { startSession({folderId: t.dataset.ctx || ''}); cam.click(); },
  importMenu(t) {
    const ctx = t.dataset.ctx || '';
    sheet('Hinzufügen', [
      {label: 'Foto aus der Mediathek', run: () => { startSession({folderId: ctx}); photos.click(); }},
      {label: 'PDF-Datei importieren', run: () => { startSession({folderId: ctx}); pdfIn.click(); }},
    ]);
  },
  importPhotos() { startSession({folderId: ''}); photos.click(); },
  importPdf() { startSession({folderId: ''}); pdfIn.click(); },
  navHome() { if (cur().view !== 'home' || stack.length > 1) resetTo({view: 'home', params: {}}); },
  navDeadlines() { if (cur().view !== 'deadlines') go('deadlines'); },
  navBackup() { if (cur().view !== 'backup') go('backup'); },
  focusSearch() { const q = $('#q'); if (q) { q.focus(); q.scrollIntoView({block: 'center', behavior: 'smooth'}); } },
  applyUpdate() { applyUpdate(); },
  checkUpdateNow() { checkUpdate(true); },
  onbNext() { go('onboarding', {step: 2}); },
  setFolderView(t) { if (folderView() !== t.dataset.v) { lsSet('ablage.folderView', t.dataset.v); cur().scroll = scrollY; render(true); } },
  openProfile() { pfDraft = null; go('profile'); },
  pickAvatar() { avatarIn.click(); },
  removeAvatar() { pfDraft.photo = ''; render(true); },
  async saveProfile() {
    const name = ($('#pfName')?.value || '').trim(), first = cur().view === 'onboarding';
    await saveProfileData(name, pfDraft?.photo || '');
    if (first) { resetTo({view: 'home', params: {}}); toast(name ? `Willkommen, ${name}!` : 'Willkommen!'); }
    else { back(); toast('Profil gespeichert'); }
  },
  async skipProfile() { await saveProfileData('', ''); resetTo({view: 'home', params: {}}); },
  scanMore() { cam.click(); },
  photosMore() { photos.click(); },
  addPages(t) { startSession({docId: t.dataset.id}); cam.click(); },
  addPhotos(t) { startSession({docId: t.dataset.id}); photos.click(); },
  removePage(t) {
    const i = +t.dataset.i, p = S.session.pages[i];
    confirmSheet('Seite ' + (i + 1) + ' entfernen?', 'Seite entfernen', () => { URL.revokeObjectURL(p.url); S.session.pages.splice(i, 1); render(true); });
  },
  movePage(t) { const i = +t.dataset.i, a = S.session.pages; [a[i - 1], a[i]] = [a[i], a[i - 1]]; render(true); },
  cancelSession() {
    const n = S.session?.pages.length || 0;
    const quit = () => { cleanupSession(); back(); };
    if (n) confirmSheet(`${n} gescannte ${n === 1 ? 'Seite' : 'Seiten'} verwerfen?`, 'Verwerfen', quit); else quit();
  },
  async finishSession(t) {
    const s = S.session;
    if (!s.docId) return go('docForm', {mode: 'new'});
    t.disabled = true;
    const d = docById(s.docId);
    d.pageIds = [...(d.pageIds || []), ...await storePages(s.pages)]; d.updated = Date.now();
    await dbPut('docs', d); cleanupSession(); back(); toast('Seiten hinzugefügt');
  },
  async saveDoc(t) {
    const form = $('#docForm'), v = Object.fromEntries(new FormData(form));
    if (v.folderId === '__new') v.folderId = '';
    const fields = {title: v.title.trim() || 'Ohne Titel', sender: v.sender.trim(), folderId: v.folderId || null, date: v.date, due: v.due, note: v.note.trim()};
    t.disabled = true;
    try {
      const c = cur();
      if (c.params.mode === 'edit') {
        const d = docById(c.params.id); Object.assign(d, fields, {updated: Date.now()});
        await dbPut('docs', d); back(); toast('Gespeichert'); return;
      }
      const s = S.session, d = {id: uid(), ...fields, done: false, created: Date.now(), updated: Date.now()};
      if (s.pdf) {
        const id = uid(); await dbPut('blobs', {id, data: await s.pdf.arrayBuffer(), type: 'application/pdf'});
        Object.assign(d, {kind: 'pdf', blobId: id, size: s.pdf.size});
      } else {
        Object.assign(d, {kind: 'scan', pageIds: await storePages(s.pages), thumb: await makeThumb(s.pages[0].blob)});
      }
      await dbPut('docs', d); S.docs.push(d); cleanupSession(); requestPersist();
      const entries = [{view: 'home', params: {}}];
      if (d.folderId) entries.push({view: 'folder', params: {id: d.folderId}});
      entries.push({view: 'doc', params: {id: d.id}});
      resetTo(...entries); toast('Abgelegt');
    } catch (e) { t.disabled = false; toast('Speichern fehlgeschlagen: ' + e.message); }
  },
  async toggleDone(t) { const d = docById(t.dataset.id); d.done = !d.done; d.updated = Date.now(); await dbPut('docs', d); render(true); },
  async sharePdf(t) {
    const d = docById(t.dataset.id);
    try { const blob = await docPdf(d); await offerFile(new File([blob], pdfName(d), {type: 'application/pdf'}), 'PDF'); }
    catch (e) { toast('PDF-Fehler: ' + e.message); }
  },
  delDoc(t) {
    const d = docById(t.dataset.id);
    confirmSheet(`„${d.title}“ endgültig löschen?`, 'Dokument löschen', async () => {
      for (const id of d.kind === 'pdf' ? [d.blobId] : d.pageIds || []) await dbDel('blobs', id);
      await dbDel('docs', d.id); S.docs = S.docs.filter(x => x !== d); back(); toast('Gelöscht');
    });
  },
  delPage(t) {
    const d = docById(t.dataset.id), pid = t.dataset.pid;
    confirmSheet('Diese Seite entfernen?', 'Seite entfernen', async () => {
      const first = d.pageIds[0] === pid;
      d.pageIds = d.pageIds.filter(x => x !== pid); await dbDel('blobs', pid);
      if (first && d.pageIds[0]) { const b = await dbGet('blobs', d.pageIds[0]); d.thumb = await makeThumb(new Blob([b.data], {type: b.type})); }
      await dbPut('docs', d); render(true);
    });
  },
  async saveFolder(t) {
    const name = $('#fName').value.trim(); if (!name) return toast('Bitte einen Namen eingeben');
    const st = views.folderEdit.state, id = t.dataset.id;
    const pv = $('#fParent').value || null;
    st.parentId = pv && folderById(pv) && !(id && descendantIds(id).includes(pv)) ? pv : null;
    if (id) { const f = folderById(id); Object.assign(f, {name, ...st}); await dbPut('folders', f); }
    else { const f = {id: uid(), name, ...st, order: S.folders.length}; await dbPut('folders', f); S.folders.push(f); }
    back();
  },
  delFolder(t) {
    const f = folderById(t.dataset.id), up = parentOf(f);
    const subs = childFolders(f.id).length;
    confirmSheet(`Ordner „${f.name}“ löschen?${subs ? ` Die ${subs} Unterordner bleiben erhalten.` : ''}`, 'Ordner löschen', async () => {
      for (const d of S.docs.filter(x => x.folderId === f.id)) { d.folderId = up; await dbPut('docs', d); }
      for (const c of childFolders(f.id)) { c.parentId = up; await dbPut('folders', c); }
      await dbDel('folders', f.id); S.folders = S.folders.filter(x => x !== f);
      stack.pop(); if (cur().view === 'folder' && cur().params.id === f.id) stack.pop(); render(true);
    });
  },
  async exportPdfs() {
    if (!S.docs.length) return toast('Noch keine Dokumente');
    toast('PDFs werden erstellt…');
    const files = [], used = new Set(), enc = new TextEncoder();
    for (const d of S.docs) {
      const f = folderById(d.folderId), dir = f ? folderPath(f).map(x => safeName(x.name)).join('/') : 'Ohne Ordner';
      files.push({name: uniquePath(used, `Ablage/${dir}/${pdfName(d)}`), data: new Uint8Array(await (await docPdf(d)).arrayBuffer())});
    }
    await offerFile(new File([makeZip(files)], `Ablage PDFs ${localISO()}.zip`, {type: 'application/zip'}), 'Export');
  },
  async backup() {
    toast('Backup wird erstellt…');
    const files = [], blobs = {};
    for (const d of S.docs) for (const id of d.kind === 'pdf' ? [d.blobId] : d.pageIds || []) {
      const b = await dbGet('blobs', id); if (!b) continue;
      blobs[id] = {type: b.type, w: b.w, h: b.h}; files.push({name: 'daten/' + id, data: new Uint8Array(b.data)});
    }
    const meta = {app: 'ablage', version: 1, created: new Date().toISOString(), folders: S.folders, docs: S.docs, blobs, profile: S.profile};
    files.unshift({name: 'ablage.json', data: new TextEncoder().encode(JSON.stringify(meta))});
    await offerFile(new File([makeZip(files)], `Ablage Backup ${localISO()}.zip`, {type: 'application/zip'}), 'Backup');
    S.meta = {...(S.meta || {id: '__meta'}), lastBackup: Date.now(), lastBackupCount: S.docs.length};
    await dbPut('blobs', S.meta);
    if (['home', 'folder', 'deadlines', 'settings', 'backup'].includes(cur().view)) render(true);
  },
  restore() { backupIn.click(); },
};
async function storePages(pages) {
  const ids = [];
  for (const p of pages) { const id = uid(); await dbPut('blobs', {id, data: await p.blob.arrayBuffer(), type: 'image/jpeg', w: p.w, h: p.h}); ids.push(id); }
  return ids;
}

document.addEventListener('click', e => {
  if (e.target.closest('.editor,.sheet-bg')) return;
  const t = e.target.closest('[data-act],[data-go],[data-doc],[data-folder]'); if (!t) return;
  if (t.dataset.act) { e.preventDefault(); actions[t.dataset.act]?.(t); }
  else if (t.dataset.go) go(t.dataset.go, {id: t.dataset.id, mode: t.dataset.mode});
  else if (t.dataset.doc) go('doc', {id: t.dataset.doc});
  else if (t.dataset.folder) go('folder', {id: t.dataset.folder});
});

/* ---------- Updates ---------- */
// Holt die aktuelle index.html direkt vom Server (an der Zwischenspeicherung vorbei) und vergleicht die Version.
let updateReady = false, lastCheck = 0;
const VERSION_RE = new RegExp("APP_" + "VERSION = '([0-9.\\-]+)'");
const freshIndex = () => fetch('./index.html?fresh=' + Date.now(), {cache: 'no-store'});
async function checkUpdate(manual) {
  if (!manual && Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const r = await freshIndex(); if (!r.ok) throw new Error(r.status);
    const m = (await r.text()).match(VERSION_RE);
    const found = !!(m && m[1] !== APP_VERSION);
    if (found && !updateReady) { updateReady = m[1]; if (['home', 'settings'].includes(cur().view)) render(true); }
    if (manual) toast(found ? 'Neue Version gefunden' : 'Du hast die neueste Version');
  } catch { if (manual) toast('Keine Verbindung – bitte später erneut versuchen'); }
}
async function applyUpdate() {
  toast('Wird aktualisiert…');
  try {
    const html = await (await freshIndex()).text();
    if ('caches' in window) {
      for (const k of await caches.keys()) {
        if (!k.startsWith('ablage-') || k.includes('fonts')) continue;
        const c = await caches.open(k);
        for (const p of ['./', './index.html'])
          await c.put(new Request(new URL(p, location.href)), new Response(html, {headers: {'Content-Type': 'text/html; charset=utf-8'}}));
      }
    }
    const reg = await navigator.serviceWorker?.getRegistration?.();
    if (reg) await reg.update().catch(() => {});
  } catch {}
  location.reload();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

/* ---------- Start ---------- */
(async () => {
  try { await loadAll(); await ensureDefaults(); }
  catch (e) { app.innerHTML = `<div class="empty">${emptyIcon('triangle-alert')}Speicher nicht verfügbar.<br>${esc(e.message)}</div>`; return; }
  const IS_DEV = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (IS_DEV) { // Vorschau am PC: zuletzt geöffnete Ansicht nach dem Neuladen wiederherstellen
    try { const s = JSON.parse(sessionStorage.getItem('ablage.dev.stack') || 'null'); if (s && s.length && s.every(e => views[e.view])) { stack.length = 0; s.forEach(e => stack.push(e)); } } catch {}
  }
  // Erster Start: Willkommen + Profil
  if (!S.profile?.done && cur().view !== 'onboarding') { stack.length = 0; stack.push({view: 'onboarding', params: {step: 1}}); }
  render();
  if (IS_DEV) {
    scrollTo(0, +(sessionStorage.getItem('ablage.dev.scroll') || 0)); devLiveReload();
    navigator.serviceWorker?.getRegistrations?.().then(rs => rs.forEach(r => r.unregister())).catch(() => {}); // kein Zwischenspeicher in der Vorschau
  }
  else if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!IS_DEV) setTimeout(() => checkUpdate(), 1500);
})();

// Live-Vorschau (nur am PC über tools/serve.ps1): lädt neu, sobald sich eine Datei ändert
function devLiveReload() {
  // Stand beim letzten Neuladen merken – so geht auch eine Änderung direkt nach dem Neuladen nicht verloren
  let last = sessionStorage.getItem('ablage.dev.mtime');
  setInterval(async () => {
    try {
      const t = await (await fetch('/__mtime', {cache: 'no-store'})).text();
      if (last !== null && t !== last && !document.querySelector('.editor')) {
        sessionStorage.setItem('ablage.dev.stack', JSON.stringify(stack));
        sessionStorage.setItem('ablage.dev.scroll', String(scrollY));
        sessionStorage.setItem('ablage.dev.mtime', t);
        location.reload();
        return;
      }
      last = t; sessionStorage.setItem('ablage.dev.mtime', t);
    } catch {}
  }, 1000);
}
