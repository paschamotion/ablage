<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ablage">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ablage</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#111114;--muted:#6c6c72;--line:#e2e2e7;
  --accent:#0a66ff;--accent-soft:rgba(10,102,255,.12);--danger:#e0352b;--warn:#c97a00;--ok:#1f9d55;
  --chip:#e8e8ed;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#9b9ba1;--line:#2c2c2e;
    --accent:#3d8bff;--accent-soft:rgba(61,139,255,.18);--chip:#2c2c2e;--shadow:none;--danger:#ff5b4f;--warn:#ffb340}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;min-height:50px;padding:6px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.top h1{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-text{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 6px;min-width:84px;text-align:left;display:flex;align-items:center;gap:2px}
.btn-text.right{justify-content:flex-end;text-align:right}
.btn-text.strong{font-weight:600}
.btn-text:disabled{opacity:.35}
.icon-btn{background:none;border:0;color:var(--accent);width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.big-title{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:0 16px 10px}
.wrap{padding:0 16px 130px;max-width:720px;margin:0 auto}

.search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px;height:40px;color:var(--muted)}
.search svg{width:18px;height:18px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;min-width:0}

.section-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:24px 4px 8px}
.link{background:none;border:0;color:var(--accent);font-size:15px;text-transform:none;letter-spacing:0;padding:0}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.folder{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:104px;display:flex;flex-direction:column}
.folder:active,.row:active{opacity:.6}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:21px}
.folder .name{font-weight:600;margin-top:auto;padding-top:10px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.folder .count{color:var(--muted);font-size:14px}
.folder.add{background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--accent);align-items:center;justify-content:center;gap:6px}

.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px 10px 14px;text-align:left}
.row:last-child{border-bottom:0}
.rc{flex:1;min-width:0}
.rc .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);opacity:.6;font-size:22px;line-height:1}
.thumb{width:42px;height:56px;border-radius:6px;object-fit:cover;object-position:top;background:var(--chip);flex:none;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--danger)}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.badge.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:44px;margin-bottom:8px}

.fabbar{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:6;pointer-events:none}
.fab{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 26px;font-size:17px;font-weight:600;box-shadow:0 8px 24px rgba(10,102,255,.35)}
.fab2{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:0;background:var(--card);color:var(--accent);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.fab:active,.fab2:active{transform:scale(.96)}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner b{display:block;font-size:15px}
.banner .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}

/* Formular */
.fgroup{background:var(--card);border-radius:14px;overflow:hidden;margin-top:18px;box-shadow:var(--shadow)}
.field{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:48px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>span{width:96px;flex:none;color:var(--text)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;padding:12px 0;text-align:right;-webkit-appearance:none;appearance:none}
.field input[type=date]{min-height:24px}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.field.col>span{width:auto;color:var(--muted);font-size:13px}
.field textarea{text-align:left;resize:none;padding-top:6px}
.field select{direction:rtl}
.field select option{direction:ltr}
.hint{color:var(--muted);font-size:13px;margin:8px 6px 0}

.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px}
.emojis button{aspect-ratio:1;border:0;border-radius:10px;background:var(--chip);font-size:22px}
.emojis button.on{outline:2.5px solid var(--accent)}
.colors{display:flex;gap:10px;padding:12px 14px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:0}
.colors button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--text)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btns{display:grid;gap:10px;margin-top:18px}
.btns.two{grid-template-columns:1fr 1fr}

/* Dokument */
.meta{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.meta .mrow{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meta .mrow:last-child{border-bottom:0}
.meta .k{color:var(--muted)}
.meta .v{text-align:right;min-width:0;overflow-wrap:anywhere}
.note{white-space:pre-wrap;text-align:left!important}
.pages{display:grid;gap:14px;margin-top:18px}
.pagewrap{position:relative}
.page{width:100%;display:block;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
.pnum{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.pdel{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.pdel svg{width:18px;height:18px}
.toggle{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--accent)}

/* Scan-Sitzung */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:8px}
.sitem{position:relative;background:var(--card);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.sitem img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--chip);border-radius:6px;display:block}
.sitem .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:14px}
.sitem .ctl button{background:none;border:0;color:var(--accent);padding:4px 6px}
.sitem .ctl button.del{color:var(--danger)}
.sitem .ctl svg{width:20px;height:20px}

/* Editor */
.editor{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.editor .top{position:static;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.editor .btn-text{color:#5aa9ff}
.ed-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.ed-box{position:relative;touch-action:none}
.ed-box canvas{display:block;width:100%;height:100%}
.ed-box svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.handle{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;touch-action:none}
.handle::after{content:"";position:absolute;inset:13px;border-radius:50%;background:rgba(61,139,255,.35);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.prev{max-width:calc(100% - 32px);max-height:calc(100% - 32px);background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.ed-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px 16px}
.ed-bar button{background:#262628;color:#fff;border:0;border-radius:999px;padding:10px 15px;font-size:15px;display:flex;align-items:center;gap:6px}
.ed-bar button svg{width:18px;height:18px}
.ed-bar button.on{background:#fff;color:#000}
.ed-help{text-align:center;color:#a0a0a8;font-size:13px;padding:0 20px}
.loupe{position:fixed;z-index:60;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;display:none;background:#000}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font-size:15px;z-index:3}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sheet + Toast */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom));animation:fade .15s}
.sheet{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:8px}
.sheet-t{color:var(--muted);font-size:13px;text-align:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet button,.sheet-cancel{display:block;width:100%;border:0;background:none;padding:16px;font-size:18px;color:var(--accent);border-bottom:1px solid var(--line)}
.sheet button:last-child{border-bottom:0}
.sheet button.danger{color:var(--danger)}
.sheet-cancel{background:var(--card);border-radius:16px;font-weight:600;border:0}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,32,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="backupInput" accept=".zip,application/zip" hidden>
<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function localISO(d = new Date()) { return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const safeName = s => (String(s || 'Dokument').replace(/[\\/:*?"<>|\n\r\t]/g, '-').trim() || 'Dokument').slice(0, 80);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

const ICON = {};
const svg = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
ICON.gear = svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>');
ICON.search = svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>');
ICON.camera = svg('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>');
ICON.plus = svg('<path d="M12 5v14M5 12h14"/>');
ICON.photo = svg('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>');
ICON.share = svg('<path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>');
ICON.trash = svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>');
ICON.back = svg('<path d="m15 18-6-6 6-6"/>');
ICON.up = svg('<path d="m15 18-6-6 6-6"/>');
ICON.x = svg('<path d="M6 6l12 12M18 6 6 18"/>');
ICON.rotate = svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>');
ICON.check = svg('<path d="m5 12 5 5 9-10"/>');
ICON.circle = svg('<circle cx="12" cy="12" r="8"/>');
ICON.checkc = svg('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>');
ICON.expand = svg('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>');
ICON.wand = svg('<path d="m15 4 5 5L9 20H4v-5z"/><path d="M13 6l5 5"/>');

/* ---------- Datenbank (IndexedDB, nur auf dem Gerät) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('ablage', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore('folders', {keyPath: 'id'});
    d.createObjectStore('docs', {keyPath: 'id'});
    d.createObjectStore('blobs', {keyPath: 'id'});
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
function tx(store, mode, fn) {
  return dbp.then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abgebrochen'));
  }));
}
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));

const S = {folders: [], docs: [], q: '', session: null, urls: []};
const DEFAULT_FOLDERS = [
  ['🧾', 'Rechnungen', '#0a66ff'], ['🏦', 'Bank & Finanzen', '#1f9d55'], ['🛡️', 'Versicherungen', '#7a5af8'],
  ['🏛️', 'Behörden & Steuern', '#c97a00'], ['🩺', 'Gesundheit', '#e0352b'], ['🏠', 'Wohnen & Verträge', '#0e9aa7'],
  ['💼', 'Arbeit', '#5b6b7f'], ['📦', 'Sonstiges', '#8e8e93']];
const EMOJIS = ['📁','🧾','🏦','🛡️','🏛️','🩺','🏠','💼','📦','🚗','📱','⚡','🎓','👶','🐾','✈️','🧑‍⚖️','💶','📈','🎁','🔧','🏋️','📚','❤️'];
const COLORS = ['#0a66ff','#1f9d55','#7a5af8','#c97a00','#e0352b','#0e9aa7','#d6409f','#5b6b7f','#8e8e93'];

async function loadAll() {
  S.folders = (await dbAll('folders')).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  S.docs = await dbAll('docs');
}
async function ensureDefaults() {
  if (S.folders.length || S.docs.length || lsGet('ablage.init', '') === '1') return;
  for (let i = 0; i < DEFAULT_FOLDERS.length; i++) {
    const [emoji, name, color] = DEFAULT_FOLDERS[i];
    await dbPut('folders', {id: uid(), name, emoji, color, order: i});
  }
  lsSet('ablage.init', '1');
  await loadAll();
}
const folderById = id => S.folders.find(f => f.id === id);
const docById = id => S.docs.find(d => d.id === id);
const isUnsorted = d => !d.folderId || !folderById(d.folderId);
function requestPersist() { try { navigator.storage?.persist?.(); } catch {} }

/* ---------- Navigation ---------- */
const app = $('#app');
const stack = [{view: 'home', params: {}}];
const views = {};
const cur = () => stack[stack.length - 1];
function go(view, params = {}) { cur().scroll = scrollY; stack.push({view, params}); render(); }
function back() { if (stack.length > 1) stack.pop(); render(true); }
function resetTo(...entries) { stack.length = 0; entries.forEach(e => stack.push(e)); render(); }
function render(restore) {
  S.urls.forEach(u => URL.revokeObjectURL(u)); S.urls = [];
  const c = cur();
  views[c.view](c.params || {});
  scrollTo(0, restore ? (c.scroll || 0) : 0);
}
function setView(html) { app.innerHTML = html; }

/* ---------- UI-Bausteine ---------- */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
// Optionen: {label, danger, run}. "run" läuft direkt im Tipp (wichtig für Kamera/Teilen auf iOS).
function sheet(title, options) {
  const m = document.createElement('div'); m.className = 'sheet-bg';
  m.innerHTML = `<div class="sheet">${title ? `<div class="sheet-t">${esc(title)}</div>` : ''}${options.map((o, i) =>
    `<button data-i="${i}" class="${o.danger ? 'danger' : ''}">${esc(o.label)}</button>`).join('')}</div>
    <button class="sheet-cancel" data-i="-1">Abbrechen</button>`;
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b && e.target !== m) return;
    m.remove();
    const i = b ? +b.dataset.i : -1;
    if (i >= 0) options[i].run();
  });
  document.body.appendChild(m);
}
const confirmSheet = (title, label, run) => sheet(title, [{label, danger: true, run}]);

function thumbHtml(d) {
  if (d.thumb) return `<img class="thumb" src="${d.thumb}" alt="">`;
  return `<div class="thumb">PDF</div>`;
}
function dueBadge(d) {
  if (!d.due) return '';
  if (d.done) return `<span class="badge ok">erledigt</span>`;
  const days = Math.round((new Date(d.due + 'T00:00') - new Date(localISO() + 'T00:00')) / 864e5);
  if (days < 0) return `<span class="badge late">überfällig</span>`;
  if (days === 0) return `<span class="badge late">heute</span>`;
  if (days <= 7) return `<span class="badge soon">in ${days} ${days === 1 ? 'Tag' : 'Tagen'}</span>`;
  return `<span class="badge">${fmtDate(d.due).slice(0, 6)}</span>`;
}
function docRow(d, showFolder = true) {
  const f = folderById(d.folderId);
  const sub = [d.sender, fmtDate(d.date)].filter(Boolean).join(' · ');
  return `<button class="row" data-doc="${d.id}">${thumbHtml(d)}<div class="rc">
    <div class="t">${esc(d.title || 'Ohne Titel')}</div>
    <div class="s">${esc(sub || '–')}</div>
    ${showFolder && f ? `<div class="s">${f.emoji} ${esc(f.name)}</div>` : ''}
  </div>${dueBadge(d)}<span class="chev">›</span></button>`;
}
function folderTile(f, n) {
  return `<button class="folder" data-folder="${f.id}">
    <div class="ico" style="background:${f.color}22">${f.emoji}</div>
    <div class="name">${esc(f.name)}</div><div class="count">${n} ${n === 1 ? 'Dokument' : 'Dokumente'}</div></button>`;
}
const fab = ctx => `<div class="fabbar">
  <button class="fab" data-act="scan" data-ctx="${ctx || ''}">${ICON.camera} Scannen</button>
  <button class="fab2" data-act="importMenu" data-ctx="${ctx || ''}" aria-label="Importieren">${ICON.plus}</button></div>`;
const byDate = (a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created;

function searchDocs(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return S.docs.filter(d => {
    const f = folderById(d.folderId);
    const hay = [d.title, d.sender, d.note, f?.name, fmtDate(d.date)].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).sort(byDate);
}

/* ---------- Bildverarbeitung ---------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht geladen werden')); };
    i.src = u;
  });
}
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctx2d(c) { return c.getContext('2d', {willReadFrequently: true}); }
function toCanvas(img, max = 2400) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = newCanvas(Math.round(img.naturalWidth * s), Math.round(img.naturalHeight * s));
  ctx2d(c).drawImage(img, 0, 0, c.width, c.height); return c;
}
function rotateCanvas(c) {
  const r = newCanvas(c.height, c.width); const x = ctx2d(r);
  x.translate(r.width, 0); x.rotate(Math.PI / 2); x.drawImage(c, 0, 0); return r;
}
const fullQuad = c => [{x: 0, y: 0}, {x: c.width, y: 0}, {x: c.width, y: c.height}, {x: 0, y: c.height}];
const insetQuad = c => { const m = .06; const w = c.width, h = c.height;
  return [{x: w * m, y: h * m}, {x: w * (1 - m), y: h * m}, {x: w * (1 - m), y: h * (1 - m)}, {x: w * m, y: h * (1 - m)}]; };

// Papier erkennen: helles Blatt auf dunklerem Untergrund
function detectQuad(c) {
  const W = c.width, H = c.height, s = Math.min(1, 360 / Math.max(W, H));
  const w = Math.max(8, Math.round(W * s)), h = Math.max(8, Math.round(H * s));
  const t = newCanvas(w, h), x = ctx2d(t); x.drawImage(c, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, N = w * h;
  const L = new Uint8Array(N), hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < N; i++, j += 4) { const v = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8; L[i] = v; hist[v]++; }
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sB = 0, wB = 0, best = 0, th = 128;
  for (let i = 0; i < 256; i++) { wB += hist[i]; if (!wB) continue; const wF = N - wB; if (!wF) break;
    sB += i * hist[i]; const v = wB * wF * (sB / wB - (sum - sB) / wF) ** 2; if (v > best) { best = v; th = i; } }
  // Kleine Löcher (Schrift) schließen: Schwelle leicht senken
  th = Math.max(40, th - 8);
  const cx = w >> 1, cy = h >> 1; let start = -1;

  while (p + 30 <= buf.length && dv.getUint32(p, true) === 0x04034b50) {
    const method = dv.getUint16(p + 8, true), size = dv.getUint32(p + 18, true), nl = dv.getUint16(p + 26, true), xl = dv.getUint16(p + 28, true);
    const name = dec.decode(buf.subarray(p + 30, p + 30 + nl)), start = p + 30 + nl + xl;
    if (method !== 0) throw new Error('Diese ZIP-Datei stammt nicht aus der Ablage.');
    out[name] = buf.subarray(start, start + size); p = start + size;
  }
  return out;
}
function uniquePath(used, path) {
  let p = path, i = 2; while (used.has(p)) p = path.replace(/\.pdf$/, ` (${i++}).pdf`); used.add(p); return p;
}

/* ---------- Aktionen ---------- */
const cam = $('#camInput'), photos = $('#photoInput'), pdfIn = $('#pdfInput'), backupIn = $('#backupInput');
function startSession(opts) { S.session = {pages: [], folderId: '', docId: null, ...opts}; }
function cleanupSession() { S.session?.pages?.forEach(p => URL.revokeObjectURL(p.url)); S.session = null; }

async function handleImages(files) {
  if (!S.session) startSession({});
  for (const file of files) {
    let c;
    try { c = toCanvas(await loadImage(file)); } catch (e) { toast(e.message); continue; }
    const r = await cropFlow(c);
    if (r) S.session.pages.push({...r, url: URL.createObjectURL(r.blob)});
  }
  if (cur().view === 'session') render();
  else if (S.session.pages.length) go('session');
  else cleanupSession();
}
cam.addEventListener('change', () => { const f = [...cam.files]; cam.value = ''; if (f.length) handleImages(f); });
photos.addEventListener('change', () => { const f = [...photos.files]; photos.value = ''; if (f.length) handleImages(f); });
pdfIn.addEventListener('change', () => {
  const f = pdfIn.files[0]; pdfIn.value = ''; if (!f) return;
  S.session.pdf = f; go('docForm', {mode: 'new'});
});
backupIn.addEventListener('change', async () => {
  const f = backupIn.files[0]; backupIn.value = ''; if (!f) return;
  try {
    toast('Backup wird gelesen…');
    const z = await readZip(f); const meta = z['ablage.json'];
    if (!meta) throw new Error('In dieser ZIP ist kein Ablage-Backup.');
    const data = JSON.parse(new TextDecoder().decode(meta));
    for (const fo of data.folders || []) await dbPut('folders', fo);
    let n = 0;
    for (const d of data.docs || []) {
      const ids = d.kind === 'pdf' ? [d.blobId] : (d.pageIds || []);
      for (const id of ids) { const raw = z['daten/' + id], info = (data.blobs || {})[id] || {};
        if (raw) await dbPut('blobs', {id, data: raw.slice().buffer, type: info.type || 'image/jpeg', w: info.w, h: info.h}); }
      await dbPut('docs', d); n++;
    }
    await loadAll(); requestPersist(); render(); toast(`${n} Dokumente wiederhergestellt`);
  } catch (e) { toast(e.message || 'Backup konnte nicht gelesen werden'); }
});

const actions = {
  back,
  hideBanner() { lsSet('ablage.banner', 'off'); render(); },
  newFolder() { go('folderEdit', {}); },
  scan(t) { startSession({folderId: t.dataset.ctx || ''}); cam.click(); },
  importMenu(t) {
    const ctx = t.dataset.ctx || '';
    sheet('Hinzufügen', [
      {label: 'Foto aus der Mediathek', run: () => { startSession({folderId: ctx}); photos.click(); }},
      {label: 'PDF-Datei importieren', run: () => { startSession({folderId: ctx}); pdfIn.click(); }},
    ]);
  },
  scanMore() { cam.click(); },
  photosMore() { photos.click(); },
  addPages(t) { startSession({docId: t.dataset.id}); cam.click(); },
  addPhotos(t) { startSession({docId: t.dataset.id}); photos.click(); },
  removePage(t) {
    const i = +t.dataset.i, p = S.session.pages[i];
    confirmSheet('Seite ' + (i + 1) + ' entfernen?', 'Seite entfernen', () => { URL.revokeObjectURL(p.url); S.session.pages.splice(i, 1); render(true); });
  },
  movePage(t) { const i = +t.dataset.i, a = S.session.pages; [a[i - 1], a[i]] = [a[i], a[i - 1]]; render(true); },
  cancelSession() {
    const n = S.session?.pages.length || 0;
    const quit = () => { cleanupSession(); back(); };
    if (n) confirmSheet(`${n} gescannte ${n === 1 ? 'Seite' : 'Seiten'} verwerfen?`, 'Verwerfen', quit); else quit();
  },
  async finishSession(t) {
    const s = S.session;
    if (!s.docId) return go('docForm', {mode: 'new'});
    t.disabled = true;
    const d = docById(s.docId);
    d.pageIds = [...(d.pageIds || []), ...await storePages(s.pages)]; d.updated = Date.now();
    await dbPut('docs', d); cleanupSession(); back(); toast('Seiten hinzugefügt');
  },
  async saveDoc(t) {
    const form = $('#docForm'), v = Object.fromEntries(new FormData(form));
    if (v.folderId === '__new') v.folderId = '';
    const fields = {title: v.title.trim() || 'Ohne Titel', sender: v.sender.trim(), folderId: v.folderId || null, date: v.date, due: v.due, note: v.note.trim()};
    t.disabled = true;
    try {
      const c = cur();
      if (c.params.mode === 'edit') {
        const d = docById(c.params.id); Object.assign(d, fields, {updated: Date.now()});
        await dbPut('docs', d); back(); toast('Gespeichert'); return;
      }
      const s = S.session, d = {id: uid(), ...fields, done: false, created: Date.now(), updated: Date.now()};
      if (s.pdf) {
        const id = uid(); await dbPut('blobs', {id, data: await s.pdf.arrayBuffer(), type: 'application/pdf'});
        Object.assign(d, {kind: 'pdf', blobId: id, size: s.pdf.size});
      } else {
        Object.assign(d, {kind: 'scan', pageIds: await storePages(s.pages), thumb: await makeThumb(s.pages[0].blob)});
      }
      await dbPut('docs', d); S.docs.push(d); cleanupSession(); requestPersist();
      const entries = [{view: 'home', params: {}}];
      if (d.folderId) entries.push({view: 'folder', params: {id: d.folderId}});
      entries.push({view: 'doc', params: {id: d.id}});
      resetTo(...entries); toast('Abgelegt ✓');
    } catch (e) { t.disabled = false; toast('Speichern fehlgeschlagen: ' + e.message); }
  },
  async toggleDone(t) { const d = docById(t.dataset.id); d.done = !d.done; await dbPut('docs', d); render(true); },
  async sharePdf(t) {
    const d = docById(t.dataset.id);
    try { const blob = await docPdf(d); await offerFile(new File([blob], pdfName(d), {type: 'application/pdf'}), 'PDF'); }
    catch (e) { toast('PDF-Fehler: ' + e.message); }
  },
  delDoc(t) {
    const d = docById(t.dataset.id);
    confirmSheet(`„${d.title}“ endgültig löschen?`, 'Dokument löschen', async () => {
      for (const id of d.kind === 'pdf' ? [d.blobId] : d.pageIds || []) await dbDel('blobs', id);
      await dbDel('docs', d.id); S.docs = S.docs.filter(x => x !== d); back(); toast('Gelöscht');
    });
  },
  delPage(t) {
    const d = docById(t.dataset.id), pid = t.dataset.pid;
    confirmSheet('Diese Seite entfernen?', 'Seite entfernen', async () => {
      const first = d.pageIds[0] === pid;
      d.pageIds = d.pageIds.filter(x => x !== pid); await dbDel('blobs', pid);
      if (first && d.pageIds[0]) { const b = await dbGet('blobs', d.pageIds[0]); d.thumb = await makeThumb(new Blob([b.data], {type: b.type})); }
      await dbPut('docs', d); render(true);
    });
  },
  async saveFolder(t) {
    const name = $('#fName').value.trim(); if (!name) return toast('Bitte einen Namen eingeben');
    const st = views.folderEdit.state, id = t.dataset.id;
    if (id) { const f = folderById(id); Object.assign(f, {name, ...st}); await dbPut('folders', f); }
    else { const f = {id: uid(), name, ...st, order: S.folders.length}; await dbPut('folders', f); S.folders.push(f); }
    back();
  },
  delFolder(t) {
    const f = folderById(t.dataset.id);
    confirmSheet(`Ordner „${f.name}“ löschen?`, 'Ordner löschen', async () => {
      for (const d of S.docs.filter(x => x.folderId === f.id)) { d.folderId = null; await dbPut('docs', d); }
      await dbDel('folders', f.id); S.folders = S.folders.filter(x => x !== f);
      stack.pop(); if (cur().view === 'folder') stack.pop(); render(true);
    });
  },
  async exportPdfs() {
    if (!S.docs.length) return toast('Noch keine Dokumente');
    toast('PDFs werden erstellt…');
    const files = [], used = new Set(), enc = new TextEncoder();
    for (const d of S.docs) {
      const f = folderById(d.folderId), dir = safeName(f ? f.name : 'Ohne Ordner');
      files.push({name: uniquePath(used, `Ablage/${dir}/${pdfName(d)}`), data: new Uint8Array(await (await docPdf(d)).arrayBuffer())});
    }
    await offerFile(new File([makeZip(files)], `Ablage PDFs ${localISO()}.zip`, {type: 'application/zip'}), 'Export');
  },
  async backup() {
    toast('Backup wird erstellt…');
    const files = [], blobs = {};
    for (const d of S.docs) for (const id of d.kind === 'pdf' ? [d.blobId] : d.pageIds || []) {
      const b = await dbGet('blobs', id); if (!b) continue;
      blobs[id] = {type: b.type, w: b.w, h: b.h}; files.push({name: 'daten/' + id, data: new Uint8Array(b.data)});
    }
    const meta = {app: 'ablage', version: 1, created: new Date().toISOString(), folders: S.folders, docs: S.docs, blobs};
    files.unshift({name: 'ablage.json', data: new TextEncoder().encode(JSON.stringify(meta))});
    await offerFile(new File([makeZip(files)], `Ablage Backup ${localISO()}.zip`, {type: 'application/zip'}), 'Backup');
  },
  restore() { backupIn.click(); },
};
async function storePages(pages) {
  const ids = [];
  for (const p of pages) { const id = uid(); await dbPut('blobs', {id, data: await p.blob.arrayBuffer(), type: 'image/jpeg', w: p.w, h: p.h}); ids.push(id); }
  return ids;
}

document.addEventListener('click', e => {
  if (e.target.closest('.editor,.sheet-bg')) return;
  const t = e.target.closest('[data-act],[data-go],[data-doc],[data-folder]'); if (!t) return;
  if (t.dataset.act) { e.preventDefault(); actions[t.dataset.act]?.(t); }
  else if (t.dataset.go) go(t.dataset.go, {id: t.dataset.id, mode: t.dataset.mode});
  else if (t.dataset.doc) go('doc', {id: t.dataset.doc});
  else if (t.dataset.folder) go('folder', {id: t.dataset.folder});
});

/* ---------- Start ---------- */
(async () => {
  try { await loadAll(); await ensureDefaults(); }
  catch (e) { app.innerHTML = `<div class="empty"><div class="big">⚠️</div>Speicher nicht verfügbar.<br>${esc(e.message)}</div>`; return; }
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
